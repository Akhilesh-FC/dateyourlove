<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – DateYourLove</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-h: 210;
      --primary-s: 80%;
      --primary-l: 55%;
      --bg-gradient: linear-gradient(135deg, hsl(210, 80%, 30%), hsl(210, 80%, 45%));
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: #fff;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: hsl(var(--primary-h), var(--primary-s), 80%);
      text-align: center;
    }
    .nav-link {
      display: block;
      padding: 0.75rem 1.2rem;
      margin: 0.4rem 0;
      border-radius: 8px;
      color: #f0f0f0;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .nav-link.active {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    /* Main content */
    .main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    .card h3 {
      margin-bottom: 1rem;
      color: hsl(var(--primary-h), var(--primary-s), 85%);
    }
    .stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1 1 150px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      text-align: center;
    }
    .stat span {
      display: block;
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
    }
    .stat small {
      font-size: 0.85rem;
      color: #ddd;
    }
    @media (max-width: 768px) {
      .sidebar { width: 200px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>Admin Panel</h2>
    <a href="/admin/dashboard" class="nav-link active">Dashboard</a>
    <a href="/admin/users" class="nav-link">Users</a>
    <a href="/admin/settings" class="nav-link">Settings</a>
    <a href="/admin/logout" class="nav-link">Logout</a>
  </aside>
  <section class="main">
    <div class="card">
      <h3>Welcome, Admin!</h3>
      <p>Here you can monitor platform statistics and manage content.</p>
    </div>
    <div class="card">
      <h3>Key Metrics</h3>
      <div class="stats">
        <div class="stat"><span>1,240</span><small>Active Users</small></div>
        <div class="stat"><span>3,452</span><small>Swipes Today</small></div>
        <div class="stat"><span>1,025</span><small>New Sign‑ups</small></div>
        <div class="stat"><span>87</span><small>Pending Reports</small></div>
      </div>
    </div>
    <!-- Future sections: recent messages, reports, etc. -->
  </section>
</body>
</html>
