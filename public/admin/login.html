<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – DateYourLove</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, hsl(210,30%,15%), hsl(210,30%,25%));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      padding: 2rem 3rem;
      border-radius: 12px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {font-size: 1.8rem; margin-bottom: 1rem; text-align:center;}
    input {width:100%; padding:0.8rem; margin:0.6rem 0; border:none; border-radius:6px; background:rgba(255,255,255,0.12); color:#fff;}
    button {width:100%; padding:0.9rem; margin-top:0.8rem; border:none; border-radius:6px; background:hsl(210,70%,55%); color:#fff; font-weight:600; cursor:pointer; transition:background .2s;}
    button:hover {background:hsl(210,70%,65%);} 
    .error {color:#ff6b6b; margin-top:0.5rem; text-align:center;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <form method="POST" action="/admin/login">
      <input type="email" name="email" placeholder="Admin Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    <div class="error" id="errMsg"></div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error')) {
        document.getElementById('errMsg').textContent = 'Invalid credentials';
      }
    </script>
  </div>
</body>
</html>
