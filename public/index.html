<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DateYourLove - Demo</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 1rem; }
      input, button { margin: .25rem 0; }
      #events { border: 1px solid #ccc; padding: .5rem; height: 200px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>DateYourLove - Demo</h1>

    <div>
      <label>Your user id: <input id="userId" value="1" /></label>
      <button id="connectBtn">Connect</button>
    </div>

    <hr />

    <div>
      <h3>Like</h3>
      <label>To user id: <input id="likeTo" value="2" /></label>
      <button id="likeBtn">Send Like</button>
    </div>

    <div>
      <h3>Message</h3>
      <label>To user id: <input id="msgTo" value="2" /></label><br />
      <input id="msgText" placeholder="Hello" />
      <button id="msgBtn">Send Message</button>
    </div>

    <h3>Events</h3>
    <div id="events"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
